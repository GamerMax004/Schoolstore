services:
  - type: web
    name: schoolstore
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: schoolstore-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
