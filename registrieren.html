<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f4"><title>Teamzugang einrichten · Schoolstore</title>
<style>
:root{--paper:#f7f8f4;--ink:#17251d;--muted:#68746a;--line:#e2e8df;--green:#59b200;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans);min-height:100vh;display:grid;place-items:center;padding:22px}.card{position:relative;width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 60px #17251d12}.logo{width:58px;height:58px;border-radius:50%;object-fit:cover}.eyebrow{margin-top:20px;color:#4b8d1a;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.card h1{font:500 34px/1.05 var(--serif);letter-spacing:-.04em;margin:9px 0}.intro{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 21px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;font-weight:700}.field input{height:42px;width:100%;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);font:12px var(--sans)}.field input:focus{outline:3px solid #59b20025;border-color:#75b83d}.button{width:100%;height:44px;border:0;border-radius:8px;background:var(--green);color:white;font-weight:750;margin-top:8px}.button:disabled{opacity:.6}.message{min-height:18px;color:#b34236;font-size:11px;margin:9px 0}.fine{font-size:10px;color:var(--muted);line-height:1.65;margin:13px 0 0}.back{display:block;margin-top:20px;color:#4d861f;font-size:11px;text-decoration:none}.success{padding:12px;border-radius:9px;background:#edf5e8;color:#315b1e;font-size:12px;line-height:1.6}.theme-toggle{position:absolute;right:19px;top:19px;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}.theme-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}html[data-theme="dark"]{color-scheme:dark;--paper:#141a16;--ink:#edf2e9;--muted:#a5b0a4;--line:#343e35}html[data-theme="dark"] body{background:var(--paper);color:var(--ink)}html[data-theme="dark"] .card{background:#1b231d;border-color:var(--line);box-shadow:0 18px 60px #0005}html[data-theme="dark"] .field input,html[data-theme="dark"] .theme-toggle{background:#222b24;color:var(--ink);border-color:#414c42}html[data-theme="dark"] .success{background:#253522;color:#c5e8b2}
</style></head><body><main class="card"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Dark-Modus aktivieren" title="Darstellung ändern"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button><img class="logo" src="schoolstore-logo.png" alt="Schoolstore"><div class="eyebrow">Team-Einladung</div><h1>Zugang einrichten.</h1><p class="intro">Lege mit deinem persönlichen Registrierungslink deinen Schoolstore-Teamzugang an.</p><form id="registerForm"><div class="field"><label for="displayName">Vor- und Nachname</label><input id="displayName" name="displayName" autocomplete="name" required minlength="2" maxlength="100"></div><div class="field"><label for="username">Benutzername</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" aria-describedby="usernameHelp"><small class="fine" id="usernameHelp">3–32 Zeichen: Buchstaben, Zahlen, Punkt, Bindestrich oder Unterstrich.</small></div><div class="field"><label for="email">E-Mail-Adresse</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></div><div class="field"><label for="passwordConfirm">Passwort wiederholen</label><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></div><div id="message" class="message" role="alert"></div><button class="button" id="submitButton" type="submit">Teamzugang erstellen</button></form><a class="back" href="verwaltung.html">← Zur Anmeldung</a></main><script src="theme.js"></script><script src="registrieren.js"></script></body></html>
